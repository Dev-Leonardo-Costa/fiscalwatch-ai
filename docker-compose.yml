services:
  postgres:
    image: postgres:17
    container_name: fiscalwatch-postgres
    environment:
      POSTGRES_DB: fiscalwatch
      POSTGRES_USER: fiscalwatch
      POSTGRES_PASSWORD: fiscalwatch
    ports:
      - "5433:5432"
    volumes:
      - fiscalwatch_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: fiscalwatch-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fiscalwatch
      RABBITMQ_DEFAULT_PASS: fiscalwatch
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - fiscalwatch_rabbitmq_data:/var/lib/rabbitmq

volumes:
  fiscalwatch_postgres_data:
  fiscalwatch_rabbitmq_data: