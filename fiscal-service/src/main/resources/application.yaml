spring:
  application:
    name: fiscal-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fiscalwatch
    username: fiscalwatch
    password: fiscalwatch

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: fiscalwatch
    password: fiscalwatch
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

fiscalwatch:
  impact-analysis-job:
    enabled: ${FISCALWATCH_IMPACT_ANALYSIS_JOB_ENABLED:false}
    fixed-delay-ms: ${FISCALWATCH_IMPACT_ANALYSIS_JOB_FIXED_DELAY_MS:300000}
    initial-delay-ms: ${FISCALWATCH_IMPACT_ANALYSIS_JOB_INITIAL_DELAY_MS:300000}
    batch-size: ${FISCALWATCH_IMPACT_ANALYSIS_JOB_BATCH_SIZE:20}
