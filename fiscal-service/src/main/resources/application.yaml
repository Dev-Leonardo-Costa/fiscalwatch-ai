spring:
  application:
    name: fiscal-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fiscalwatch
    username: fiscalwatch
    password: fiscalwatch

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: fiscalwatch
    password: fiscalwatch
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
